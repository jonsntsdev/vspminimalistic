services:
  - type: web
    name: edgekanbann
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
